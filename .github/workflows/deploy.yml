name: Pipeline CD - Despliegue Automatizado Remoto

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Despliegue remoto usando SSH Nativo de Linux
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          # 1. Configurar la llave privada en el entorno temporal de GitHub
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          # 2. Desactivar la verificación estricta de hosts para evitar bloqueos interactivos
          echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config

          # 3. Conectarse y ejecutar el despliegue de forma nativa por el puerto 22
          ssh root@$SSH_HOST -p 22 << 'REMOTE_EOF'
            echo "🚀 Conectado con éxito al Balanceador mediante SSH nativo de Linux!"
            
            # Crear el archivo index.php dentro del Balanceador
            cat << 'EOF' > /root/index.php
            <?php
            error_reporting(E_ALL);
            ini_set('display_errors', 1);

            echo "<h1>🚀 ¡Despliegue Global Exitoso desde la Nube de GitHub Actions hacia mi WSL! 🚀</h1>";

            $mysqli = new mysqli("10.0.20.10", "web_user", "PasswordSegura123", "lab_devops");

            if ($mysqli->connect_error) {
                echo "<p>Error de conexión a la DB: " . $mysqli->connect_error . "</p>";
            } else {
                echo "<p>Conexión a la DB centralizada: <b>EXITOSA</b></p>";
                echo "<p>Hora actual del clúster inmutable: " . date("H:i:s") . "</p>";
            }
            ?>
            EOF
            
            echo "📦 Repartiendo el nuevo código hacia los Nodos Web de LXD..."
            lxc file push /root/index.php srv-web-tf-1/root/index.php
            lxc file push /root/index.php srv-web-tf-2/root/index.php
            
            echo "🔧 Ajustando permisos y refrescando contenedores Docker..."
            lxc exec srv-web-tf-1 -- chmod 644 /root/index.php
            lxc exec srv-web-tf-2 -- chmod 644 /root/index.php
            lxc exec srv-web-tf-1 -- docker restart mi-servidor-web-1
            lxc exec srv-web-tf-2 -- docker restart mi-servidor-web-2
            
            echo "✨ ¡Despliegue global completado con éxito por el pipeline!"
          REMOTE_EOF
